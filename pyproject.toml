[project]
name = "study"
version = "0.1.0"
description = "Oral exam simulator and Anki card generator for French engineering-school orals"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oral = "study.oral.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["study*"]
